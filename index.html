<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grok Bot">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<title>Grok Bot</title>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>
<nav id="tabs" class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="agents"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M1.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5zM11.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5z"/></svg><span>Agents</span></button>
  <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span></button>
  <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.4 4-6.5 8-6.5s7.2 2.1 8 6.5z"/></svg><span>Account</span></button>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
